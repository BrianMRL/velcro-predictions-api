<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Velcro Predictions</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="overlay">

        <div id="top-section">

            <div id="question">
                Cargando...
            </div>

            <div id="timer-wrapper">

                <svg id="timer-svg">

                    <circle
                        cx="70"
                        cy="70"
                        r="60"
                        id="timer-bg"
                    />

                    <circle
                        cx="70"
                        cy="70"
                        r="60"
                        id="timer-progress"
                    />

                </svg>

                <div id="timer-text">
                    120
                </div>

            </div>

        </div>

        <div id="status">
            ACTIVE
        </div>

        <div class="options">

            <div class="option cyan">

                <div class="title" id="option1-title">
                    Opción 1
                </div>

                <div class="bar-container">
                    <div class="bar" id="option1-bar"></div>
                </div>

                <div class="points" id="option1-points">
                    0
                </div>

                <div class="predictors" id="option1-users">

                </div>

            </div>

            <div class="option magenta">

                <div class="title" id="option2-title">
                    Opción 2
                </div>

                <div class="bar-container">
                    <div class="bar" id="option2-bar"></div>
                </div>

                <div class="points" id="option2-points">
                    0
                </div>

                <div class="predictors" id="option2-users">

                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
